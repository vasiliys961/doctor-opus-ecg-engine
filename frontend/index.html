<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f6e6e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ЭКГ">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Doctor Opus ECG Engine</title>
  <style>
    :root { color-scheme: light; --ink: #1c2430; --line: #d5dbe3; --paper: #f4f7f8; --accent: #0f6e6e; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; font: 19px/1.45 "Iowan Old Style", Palatino, Georgia, serif; color: var(--ink); background: var(--paper); }
    main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 72px; }
    h1 { font-size: 1.7rem; margin: 0 0 8px; }
    h2 { font-size: 1.35rem; }
    .note { color: #4d5968; max-width: 68ch; }
    .modes { display: flex; gap: 8px; margin: 22px 0; }
    button, .file input, input, select, textarea { font: inherit; }
    button, label.file {
      min-height: 52px;
      border: 1px solid var(--line);
      background: white;
      border-radius: 14px;
      padding: 14px 18px;
      cursor: pointer;
    }
    .modes button.active { background: var(--accent); color: white; border-color: var(--accent); }
    .primary { background: var(--accent); color: white; border-color: var(--accent); }
    section { display: block; margin-top: 16px; background: white; border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch; margin: 12px 0; }
    label.file { position: relative; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
    label.file input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    textarea { width: 100%; min-height: 96px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; }
    input:not([type="radio"]), select { padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: white; }
    .ruler { margin-top: 8px; }
    .ruler summary { min-height: 52px; display: flex; align-items: center; cursor: pointer; font-size: 1.05rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .score { font-variant-numeric: tabular-nums; text-align: right; }
    .stage { display: grid; grid-template-columns: 1.4fr 0.8fr; gap: 16px; }
    .preview-wrap { position: relative; overflow: auto; border: 1px solid var(--line); background: #fff; }
    .preview-wrap img { display: block; max-width: 100%; }
    .preview-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .handle { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: #0f6e6e; border: 2px solid white; cursor: grab; }
    .error { color: #8d1d1d; }
    .report h3 { margin: 18px 0 6px; font-size: 1.05rem; color: var(--accent); }
    .report p, .report li { max-width: 68ch; margin: 0 0 8px; }
    .report ul { margin: 0 0 8px; padding-left: 1.2rem; }
    label.field { display: flex; flex-direction: column; gap: 6px; min-width: 12rem; flex: 1; }
    .protocol-sheet { margin-top: 8px; }
    .protocol-sheet h2 { margin: 0 0 4px; font-size: 1.35rem; }
    .protocol-head p { margin: 0 0 2px; }
    @media print {
      body { background: white; }
      main > h1, main > .note, #patient-card, #install-app, #install-hint, #panel-image > h2, #panel-image > .note,
      #panel-image .row, #panel-image label, #dictate-context, #preview-box, .ruler, #strip-frames, #image-error,
      #interpretation, #protocol-actions, #share-actions, #protocol-status { display: none !important; }
      #panel-image { border: 0; padding: 0; }
      #protocol { display: block !important; }
    }
    .strip-frames { display: flex; gap: 8px; overflow-x: auto; margin: 8px 0 12px; }
    .strip-frames img { height: 92px; width: auto; border: 1px solid var(--line); background: white; }
    .strip-player { position: fixed; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
    .coming { background: #eef3f3; }
    @media (max-width: 800px) {
      .stage { grid-template-columns: 1fr; }
      .row { flex-direction: column; }
      button, label.file, label.field { width: 100%; }
    }
  </style>
</head>
<body>
<main>
  <h1>Doctor Opus ECG</h1>
  <p class="note">Поддержка решения, не диагноз.</p>
  <button type="button" id="install-app">На экран</button>
  <p id="install-hint" class="note" hidden></p>

  <section id="patient-card">
    <h2>Пациент</h2>
    <p class="note">ФИО остаётся в телефоне и в разбор не уходит.</p>
    <div class="row">
      <label class="field">ФИО <input id="patient-name" type="text" autocomplete="name"></label>
      <label class="field">Год рождения <input id="patient-year" type="number" inputmode="numeric" min="1900" max="2100" step="1"></label>
      <label class="field">Пол
        <select id="patient-sex">
          <option value="">не указан</option>
          <option value="муж.">муж.</option>
          <option value="жен.">жен.</option>
        </select>
      </label>
      <label class="field">Дата снятия ЭКГ <input id="patient-date" type="date"></label>
    </div>
  </section>

  <section id="panel-image" class="active">
    <h2>ЭКГ</h2>
    <p class="note">Снимок или короткий ролик вдоль ленты.</p>
    <div class="row">
      <label class="file">Изображение <input id="image-file" type="file" accept="image/jpeg,image/png,image/gif,image/webp,image/heic,image/heif,.heic,.heif"></label>
      <label class="file">Видео ленты <input id="strip-video" type="file" accept="video/mp4,video/quicktime,video/webm,video/*"></label>
      <button class="primary" id="analyze-image" type="button">Разобрать</button>
    </div>
    <div id="strip-frames" class="strip-frames" hidden></div>
    <video id="strip-player" class="strip-player" playsinline muted></video>
    <label>Текст: измерения, описание кривой, заключение аппарата<br><textarea id="notes"></textarea></label>
    <label>Клинический контекст без фамилии и контактов<br><textarea id="context"></textarea></label>
    <button type="button" id="dictate-context">Голосом</button>
    <div class="preview-wrap" id="preview-box" hidden>
      <img id="preview" alt="Загруженная ЭКГ">
      <svg id="caliper"></svg>
      <div class="handle" id="handle-a"></div>
      <div class="handle" id="handle-b"></div>
    </div>
    <details class="ruler">
      <summary>Линейка</summary>
      <label>Пикселей на 1 мм <input id="px-per-mm" type="number" min="0.1" step="0.1" value="4"></label>
      <div class="row">
        <label><input type="radio" name="speed" value="25" checked> 25 мм/с</label>
        <label><input type="radio" name="speed" value="50"> 50 мм/с</label>
      </div>
      <label>Усиление, мм/мВ <input id="gain" type="number" min="1" step="1" value="10"></label>
      <p id="caliper-readout">Интервал: — · Амплитуда: —</p>
    </details>
    <p id="analyze-status" class="note"></p>
    <p id="image-error" class="error"></p>
    <article id="interpretation" class="report"></article>
    <div class="row" id="protocol-actions" hidden>
      <button class="primary" id="make-protocol" type="button">Сформировать протокол</button>
      <button type="button" id="speak-conclusion">Прослушать</button>
    </div>
    <p id="protocol-status" class="note"></p>
    <article id="protocol" class="report protocol-sheet" hidden></article>
    <div class="row" id="share-actions" hidden>
      <button id="print-protocol" type="button">Печать</button>
      <button id="download-protocol" type="button">Скачать Word</button>
      <button id="share-protocol" type="button">Поделиться</button>
    </div>
  </section>
</main>
<script>
const preview = document.getElementById("preview");
const box = document.getElementById("preview-box");
const svg = document.getElementById("caliper");
const handleA = document.getElementById("handle-a");
const handleB = document.getElementById("handle-b");
let points = [{ x: 40, y: 80 }, { x: 160, y: 80 }];
let shownConclusion = "";
let shownExtraction = null;
let protocolText = "";
let drag = null;

function placeHandles() {
  handleA.style.left = points[0].x + "px";
  handleA.style.top = points[0].y + "px";
  handleB.style.left = points[1].x + "px";
  handleB.style.top = points[1].y + "px";
  svg.innerHTML = `<line x1="${points[0].x}" y1="${points[0].y}" x2="${points[1].x}" y2="${points[1].y}" stroke="#0f6e6e" stroke-width="2"/>`;
  const pxPerMm = Number(document.getElementById("px-per-mm").value);
  const speed = Number(document.querySelector("input[name=speed]:checked").value);
  const gain = Number(document.getElementById("gain").value);
  const dx = Math.abs(points[1].x - points[0].x);
  const dy = Math.abs(points[1].y - points[0].y);
  if (!(pxPerMm > 0) || !(speed > 0) || !(gain > 0)) {
    document.getElementById("caliper-readout").textContent = "Нужна калибровка px/мм, скорость и усиление.";
    return;
  }
  const timeMs = dx / pxPerMm * (1000 / speed);
  const milliVolts = dy / pxPerMm / gain;
  document.getElementById("caliper-readout").textContent =
    `Интервал: ${timeMs.toFixed(0)} мс · Амплитуда: ${milliVolts.toFixed(2)} мВ`;
}

function bindHandle(node, index) {
  node.onpointerdown = (event) => {
    drag = index;
    node.setPointerCapture(event.pointerId);
  };
  node.onpointermove = (event) => {
    if (drag !== index) return;
    const rect = box.getBoundingClientRect();
    points[index] = {
      x: Math.max(0, event.clientX - rect.left + box.scrollLeft),
      y: Math.max(0, event.clientY - rect.top + box.scrollTop),
    };
    placeHandles();
  };
  node.onpointerup = () => { drag = null; };
}

bindHandle(handleA, 0);
bindHandle(handleB, 1);
document.getElementById("px-per-mm").oninput = placeHandles;
document.getElementById("gain").oninput = placeHandles;
document.querySelectorAll("input[name=speed]").forEach((node) => { node.onchange = placeHandles; });

function readyImageBytes(bytes) {
  if (bytes[0] === 0xff && bytes[1] === 0xd8) return true;
  if (bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4e && bytes[3] === 0x47) return true;
  if (bytes[0] === 0x47 && bytes[1] === 0x49 && bytes[2] === 0x46) return true;
  return bytes[0] === 0x52 && bytes[1] === 0x49 && bytes[2] === 0x46 && bytes[3] === 0x46
    && bytes[8] === 0x57 && bytes[9] === 0x45 && bytes[10] === 0x42 && bytes[11] === 0x50;
}

function jpegFile(source, name) {
  const canvas = document.createElement("canvas");
  canvas.width = source.width;
  canvas.height = source.height;
  canvas.getContext("2d").drawImage(source, 0, 0);
  return new Promise((resolve, reject) => {
    canvas.toBlob((blob) => {
      if (!blob) {
        reject(new Error("jpeg"));
        return;
      }
      const stem = (name || "ecg").replace(/\.[^.]+$/, "") || "ecg";
      resolve(new File([blob], stem + ".jpg", { type: "image/jpeg" }));
    }, "image/jpeg", 0.92);
  });
}

function openImage(file) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    const url = URL.createObjectURL(file);
    image.onload = () => {
      URL.revokeObjectURL(url);
      resolve(image);
    };
    image.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("decode"));
    };
    image.src = url;
  });
}

async function imageForReview(file) {
  const bytes = new Uint8Array(await file.slice(0, 16).arrayBuffer());
  if (readyImageBytes(bytes)) return file;
  return jpegFile(await openImage(file), file.name);
}

let reviewImage = null;
let reviewReady = Promise.resolve();
let stripFrames = [];
let stripReady = Promise.resolve();
let stripUrls = [];

function clearStrip() {
  stripFrames = [];
  stripReady = Promise.resolve();
  stripUrls.forEach((url) => URL.revokeObjectURL(url));
  stripUrls = [];
  const frames = document.getElementById("strip-frames");
  frames.replaceChildren();
  frames.hidden = true;
  const video = document.getElementById("strip-video");
  if (video) video.value = "";
}

function showStrip(files) {
  stripUrls.forEach((url) => URL.revokeObjectURL(url));
  stripUrls = files.map((file) => URL.createObjectURL(file));
  const frames = document.getElementById("strip-frames");
  frames.replaceChildren();
  stripUrls.forEach((url, index) => {
    const image = document.createElement("img");
    image.src = url;
    image.alt = "Кадр " + (index + 1);
    frames.append(image);
  });
  frames.hidden = files.length === 0;
  if (files.length) {
    preview.src = stripUrls[0];
    box.hidden = false;
    preview.onload = placeHandles;
  }
}

function seekStrip(player, time) {
  return new Promise((resolve, reject) => {
    const target = Math.min(Math.max(time, 0), Math.max(player.duration - 0.05, 0));
    const finish = () => {
      player.removeEventListener("seeked", finish);
      player.removeEventListener("error", fail);
      resolve();
    };
    const fail = () => {
      player.removeEventListener("seeked", finish);
      player.removeEventListener("error", fail);
      reject(new Error("seek"));
    };
    if (Math.abs(player.currentTime - target) < 0.03) {
      resolve();
      return;
    }
    player.addEventListener("seeked", finish);
    player.addEventListener("error", fail);
    player.currentTime = target;
  });
}

function paintStrip(player) {
  if (!player.videoWidth || !player.videoHeight) throw new Error("video");
  const scale = Math.min(1, 1100 / player.videoWidth);
  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.round(player.videoWidth * scale));
  canvas.height = Math.max(1, Math.round(player.videoHeight * scale));
  canvas.getContext("2d").drawImage(player, 0, 0, canvas.width, canvas.height);
  return canvas;
}

function stripThumb(canvas) {
  const sample = document.createElement("canvas");
  sample.width = 24;
  sample.height = 16;
  const context = sample.getContext("2d", { willReadFrequently: true });
  context.drawImage(canvas, 0, 0, sample.width, sample.height);
  const data = context.getImageData(0, 0, sample.width, sample.height).data;
  const gray = new Uint8Array(sample.width * sample.height);
  for (let i = 0; i < gray.length; i += 1) {
    gray[i] = (data[i * 4] + data[i * 4 + 1] + data[i * 4 + 2]) / 3;
  }
  return gray;
}

function stripDifference(left, right) {
  let total = 0;
  for (let i = 0; i < left.length; i += 1) total += Math.abs(left[i] - right[i]);
  return total / left.length;
}

function stripSharpness(canvas) {
  const sample = document.createElement("canvas");
  sample.width = 48;
  sample.height = 32;
  const context = sample.getContext("2d", { willReadFrequently: true });
  context.drawImage(canvas, 0, 0, sample.width, sample.height);
  const data = context.getImageData(0, 0, sample.width, sample.height).data;
  let energy = 0;
  let count = 0;
  for (let y = 0; y < sample.height; y += 1) {
    for (let x = 1; x < sample.width; x += 1) {
      const here = (y * sample.width + x) * 4;
      const prev = here - 4;
      energy += Math.abs((data[here] + data[here + 1] + data[here + 2]) - (data[prev] + data[prev + 1] + data[prev + 2]));
      count += 1;
    }
  }
  return energy / count;
}

function chooseStrip(candidates) {
  const kept = [];
  candidates.forEach((item) => {
    const last = kept[kept.length - 1];
    if (last && stripDifference(last.thumb, item.thumb) < 10) {
      if (item.sharp > last.sharp) kept[kept.length - 1] = item;
      return;
    }
    kept.push(item);
  });
  if (kept.length <= 6) return kept;
  const picked = [];
  for (let i = 0; i < 6; i += 1) {
    picked.push(kept[Math.round((i * (kept.length - 1)) / 5)]);
  }
  return picked;
}

function canvasJpeg(canvas, index) {
  return new Promise((resolve, reject) => {
    canvas.toBlob((blob) => {
      if (!blob) {
        reject(new Error("jpeg"));
        return;
      }
      resolve(new File([blob], "strip-" + (index + 1) + ".jpg", { type: "image/jpeg" }));
    }, "image/jpeg", 0.74);
  });
}

async function framesFromStrip(file) {
  const player = document.getElementById("strip-player");
  const url = URL.createObjectURL(file);
  try {
    await new Promise((resolve, reject) => {
      player.onloadedmetadata = resolve;
      player.onerror = () => reject(new Error("video"));
      player.src = url;
      player.load();
    });
    const duration = player.duration;
    if (!Number.isFinite(duration) || duration <= 0) throw new Error("video");
    const span = Math.min(duration, 25);
    const count = Math.min(12, Math.max(4, Math.round(span / 0.5)));
    const candidates = [];
    for (let i = 0; i < count; i += 1) {
      const time = (span * (i + 0.5)) / count;
      await seekStrip(player, time);
      const canvas = paintStrip(player);
      candidates.push({
        time,
        canvas,
        thumb: stripThumb(canvas),
        sharp: stripSharpness(canvas),
      });
    }
    const chosen = chooseStrip(candidates);
    const files = [];
    for (let i = 0; i < chosen.length; i += 1) files.push(await canvasJpeg(chosen[i].canvas, i));
    return files;
  } finally {
    player.removeAttribute("src");
    player.load();
    URL.revokeObjectURL(url);
  }
}

document.getElementById("image-file").onchange = () => {
  const file = document.getElementById("image-file").files[0];
  const error = document.getElementById("image-error");
  error.textContent = "";
  reviewImage = null;
  clearStrip();
  if (!file) {
    reviewReady = Promise.resolve();
    return;
  }
  reviewReady = imageForReview(file).then((ready) => {
    reviewImage = ready;
    preview.src = URL.createObjectURL(ready);
    box.hidden = false;
    preview.onload = placeHandles;
  }).catch(() => {
    reviewImage = null;
    box.hidden = true;
    error.textContent = "Снимок с айфона не открылся. Нажмите «Изображение» и выберите «Снять фото».";
  });
};

document.getElementById("strip-video").onchange = () => {
  const file = document.getElementById("strip-video").files[0];
  const error = document.getElementById("image-error");
  const status = document.getElementById("analyze-status");
  error.textContent = "";
  reviewImage = null;
  reviewReady = Promise.resolve();
  document.getElementById("image-file").value = "";
  stripFrames = [];
  if (!file) {
    clearStrip();
    return;
  }
  status.textContent = "Беру кадры вдоль ленты.";
  setBusy(true);
  stripReady = framesFromStrip(file).then((frames) => {
    stripFrames = frames;
    showStrip(frames);
    status.textContent = frames.length ? "Кадров ленты: " + frames.length + "." : "";
  }).catch(() => {
    stripFrames = [];
    showStrip([]);
    error.textContent = "Ролик не открылся. Снимите ленту ещё раз коротким видео.";
    status.textContent = "";
  }).finally(() => {
    setBusy(false);
  });
};

function errorText(payload, fallback) {
  const detail = payload && payload.detail;
  if (typeof detail === "string" && detail.trim()) return detail;
  if (Array.isArray(detail)) {
    const text = detail.map((item) => item.msg || "").filter(Boolean).join(" ");
    if (text) return text;
  }
  return fallback;
}

function setBusy(busy) {
  document.getElementById("analyze-image").disabled = busy;
  document.getElementById("make-protocol").disabled = busy;
}

document.getElementById("analyze-image").onclick = async () => {
  await reviewReady;
  await stripReady;
  const picked = document.getElementById("image-file").files[0];
  const pickedVideo = document.getElementById("strip-video").files[0];
  const frames = stripFrames.slice();
  const file = frames.length ? null : reviewImage;
  const notes = document.getElementById("notes").value.trim();
  const error = document.getElementById("image-error");
  const status = document.getElementById("analyze-status");
  error.textContent = "";
  if (pickedVideo && !frames.length) {
    error.textContent = "Ролик не открылся. Снимите ленту ещё раз коротким видео.";
    return;
  }
  if (picked && !file && !frames.length) {
    error.textContent = "Снимок с айфона не открылся. Нажмите «Изображение» и выберите «Снять фото».";
    return;
  }
  if (!file && !frames.length && !notes) {
    error.textContent = "Нужен снимок, ролик ленты или текст.";
    return;
  }
  setBusy(true);
  status.textContent = frames.length
    ? "Разбираю ленту. Это занимает около минуты."
    : "Разбираю снимок. Это занимает около минуты.";
  const body = new FormData();
  frames.forEach((frame) => body.append("frames", frame));
  if (file) body.append("file", file);
  body.append("notes", notes);
  body.append("clinical_context", document.getElementById("context").value);
  try {
    const response = await fetch("/api/ecg/analyze", { method: "POST", body });
    const payload = await response.json();
    if (!response.ok) {
      error.textContent = errorText(payload, "Разбор не выполнен.");
      return;
    }
    shownConclusion = payload.interpretation || "";
    shownExtraction = payload.extraction || null;
    protocolText = "";
    document.getElementById("protocol").replaceChildren();
    document.getElementById("protocol").hidden = true;
    document.getElementById("share-actions").hidden = true;
    document.getElementById("protocol-status").textContent = "";
    renderReport(shownConclusion, "interpretation");
    document.getElementById("protocol-actions").hidden = !shownConclusion.trim();
    document.getElementById("interpretation").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (requestError) {
    error.textContent = "Разбор прервался. Нажмите «Разобрать» ещё раз.";
  } finally {
    status.textContent = "";
    setBusy(false);
  }
};

document.getElementById("make-protocol").onclick = async () => {
  const status = document.getElementById("protocol-status");
  const source = shownConclusion.trim() || document.getElementById("interpretation").innerText.trim();
  if (!source) {
    status.textContent = "Сначала дождитесь заключения по кнопке «Разобрать».";
    return;
  }
  setBusy(true);
  status.textContent = "Собираю протокол. Это отдельный шаг и тоже занимает время.";
  try {
    const response = await fetch("/api/ecg/protocol", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ interpretation: source, extraction: shownExtraction }),
    });
    const payload = await response.json();
    if (!response.ok) {
      status.textContent = errorText(payload, "Протокол не собран.");
      return;
    }
    protocolText = payload.protocol || "";
    if (!protocolText.trim()) {
      status.textContent = "Протокол пришёл пустым.";
      return;
    }
    renderProtocol(protocolText);
    status.textContent = "";
    document.getElementById("share-actions").hidden = false;
    document.getElementById("protocol").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (requestError) {
    status.textContent = "Протокол не собрался. Нажмите кнопку ещё раз.";
  } finally {
    setBusy(false);
  }
};

document.getElementById("print-protocol").onclick = () => window.print();
document.getElementById("download-protocol").onclick = () => downloadProtocol(protocolText);
document.getElementById("share-protocol").onclick = () => shareProtocol(protocolText, document.getElementById("protocol-status"));

function ageText(years) {
  const n = years % 100;
  const last = n % 10;
  if (n > 10 && n < 20) return `${years} лет`;
  if (last === 1) return `${years} год`;
  if (last >= 2 && last <= 4) return `${years} года`;
  return `${years} лет`;
}

function patientLines() {
  const recorded = document.getElementById("patient-date").value;
  const birth = document.getElementById("patient-year").value.trim();
  const sex = document.getElementById("patient-sex").value;
  let recordedText = "";
  if (/^\d{4}-\d{2}-\d{2}$/.test(recorded)) {
    const [year, month, day] = recorded.split("-");
    recordedText = `${day}.${month}.${year}`;
  }
  let age = "";
  if (/^\d{4}$/.test(birth) && /^\d{4}/.test(recorded)) {
    const years = Number(recorded.slice(0, 4)) - Number(birth);
    if (years >= 0 && years <= 130) age = ageText(years);
  }
  const lines = [
    ["ФИО", document.getElementById("patient-name").value.trim()],
    ["Возраст", age],
  ];
  if (!age && birth) lines.push(["Год рождения", birth]);
  if (sex) lines.push(["Пол", sex]);
  lines.push(["Дата снятия ЭКГ", recordedText]);
  return lines;
}

function protocolDocument(body) {
  const head = patientLines().map(([label, value]) => `${label}: ${value}`).join("\n");
  return `Протокол описания ЭКГ\n${head}\n\n${String(body).trim()}`.replace(/\*\*/g, "").replace(/\*/g, "");
}

function crc32(data) {
  let crc = -1;
  for (let index = 0; index < data.length; index += 1) {
    crc ^= data[index];
    for (let bit = 0; bit < 8; bit += 1) {
      crc = (crc >>> 1) ^ (0xedb88320 & -(crc & 1));
    }
  }
  return (~crc) >>> 0;
}

function storeZip(files) {
  const encoder = new TextEncoder();
  const locals = [];
  const central = [];
  let offset = 0;
  files.forEach((file) => {
    const name = encoder.encode(file.name);
    const data = typeof file.data === "string" ? encoder.encode(file.data) : file.data;
    const crc = crc32(data);
    const local = new Uint8Array(30 + name.length + data.length);
    const view = new DataView(local.buffer);
    view.setUint32(0, 0x04034b50, true);
    view.setUint16(4, 20, true);
    view.setUint32(14, crc, true);
    view.setUint32(18, data.length, true);
    view.setUint32(22, data.length, true);
    view.setUint16(26, name.length, true);
    local.set(name, 30);
    local.set(data, 30 + name.length);
    locals.push(local);
    const entry = new Uint8Array(46 + name.length);
    const directory = new DataView(entry.buffer);
    directory.setUint32(0, 0x02014b50, true);
    directory.setUint16(4, 20, true);
    directory.setUint16(6, 20, true);
    directory.setUint32(16, crc, true);
    directory.setUint32(20, data.length, true);
    directory.setUint32(24, data.length, true);
    directory.setUint16(28, name.length, true);
    directory.setUint32(42, offset, true);
    entry.set(name, 46);
    central.push(entry);
    offset += local.length;
  });
  const centralSize = central.reduce((sum, entry) => sum + entry.length, 0);
  const end = new Uint8Array(22);
  const endView = new DataView(end.buffer);
  endView.setUint32(0, 0x06054b50, true);
  endView.setUint16(8, files.length, true);
  endView.setUint16(10, files.length, true);
  endView.setUint32(12, centralSize, true);
  endView.setUint32(16, offset, true);
  return new Blob([...locals, ...central, end], { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
}

function protocolDocx(body) {
  const escape = (text) => text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const paragraphs = protocolDocument(body).split("\n").map((line) => (
    `<w:p><w:r><w:t xml:space="preserve">${escape(line)}</w:t></w:r></w:p>`
  )).join("");
  const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${paragraphs}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/></w:sectPr></w:body></w:document>`;
  return storeZip([
    {
      name: "[Content_Types].xml",
      data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`,
    },
    {
      name: "_rels/.rels",
      data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`,
    },
    { name: "word/document.xml", data: documentXml },
    {
      name: "word/_rels/document.xml.rels",
      data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>`,
    },
  ]);
}

function downloadProtocol(body) {
  const stamp = document.getElementById("patient-date").value || "protocol";
  const url = URL.createObjectURL(protocolDocx(body));
  const link = document.createElement("a");
  link.href = url;
  link.download = `ecg-${stamp}.docx`;
  link.click();
  URL.revokeObjectURL(url);
}

async function shareProtocol(body, status) {
  const text = protocolDocument(body);
  if (navigator.share) {
    try {
      await navigator.share({ title: "Протокол описания ЭКГ", text });
      return;
    } catch (shareError) {
      if (shareError && shareError.name === "AbortError") return;
    }
  }
  await navigator.clipboard.writeText(text);
  status.textContent = "Текст протокола скопирован.";
}

function fillProtocolHead(root) {
  let head = root.querySelector(".protocol-head");
  if (!head) {
    head = document.createElement("div");
    head.className = "protocol-head";
    const title = root.querySelector("h2");
    if (title) title.after(head);
    else root.prepend(head);
  }
  head.replaceChildren();
  patientLines().forEach(([label, value]) => {
    const line = document.createElement("p");
    line.textContent = `${label}: ${value}`;
    head.appendChild(line);
  });
}

["patient-name", "patient-year", "patient-date", "patient-sex"].forEach((id) => {
  document.getElementById(id).addEventListener("input", () => {
    const root = document.getElementById("protocol");
    if (!root.hidden && root.querySelector(".protocol-head")) fillProtocolHead(root);
  });
});

function renderProtocol(text) {
  const root = document.getElementById("protocol");
  root.hidden = false;
  root.replaceChildren();
  const title = document.createElement("h2");
  title.textContent = "Протокол описания ЭКГ";
  root.append(title);
  fillProtocolHead(root);
  renderReport(text, "protocol", false);
}

function renderReport(text, targetId = "interpretation", clear = true) {
  const root = document.getElementById(targetId);
  if (clear) root.replaceChildren();
  const cleaned = String(text).replace(/\*\*/g, "").replace(/\*/g, "");
  let list = null;
  cleaned.split("\n").forEach((raw) => {
    const line = raw.trim();
    if (!line) {
      list = null;
      return;
    }
    const bare = line.replace(/:$/, "");
    const title = SECTION_TITLES[bare.toLowerCase()];
    if (title) {
      list = null;
      const heading = document.createElement("h3");
      heading.textContent = title;
      root.appendChild(heading);
      return;
    }
    const item = line.replace(/^[-•]\s*/, "");
    if (/не указано|not specified/i.test(item)) return;
    if (line.startsWith("-") || line.startsWith("•")) {
      if (!list) {
        list = document.createElement("ul");
        root.appendChild(list);
      }
      const row = document.createElement("li");
      row.textContent = item;
      list.appendChild(row);
      return;
    }
    list = null;
    const paragraph = document.createElement("p");
    paragraph.textContent = item;
    root.appendChild(paragraph);
  });
}

const SpeechApi = window.SpeechRecognition || window.webkitSpeechRecognition;
let dictation = null;

document.getElementById("dictate-context").onclick = () => {
  const button = document.getElementById("dictate-context");
  const field = document.getElementById("context");
  if (!SpeechApi) {
    field.focus();
    document.getElementById("image-error").textContent = "На айфоне нажмите микрофон на клавиатуре.";
    return;
  }
  if (dictation) {
    dictation.stop();
    return;
  }
  const recognition = new SpeechApi();
  recognition.lang = "ru-RU";
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.onresult = (event) => {
    let said = "";
    for (let i = event.resultIndex; i < event.results.length; i += 1) {
      if (event.results[i].isFinal) said += event.results[i][0].transcript;
    }
    said = said.trim();
    if (!said) return;
    const current = field.value.trim();
    field.value = current ? current + " " + said : said;
  };
  recognition.onerror = () => {
    dictation = null;
    button.textContent = "Голосом";
  };
  recognition.onend = () => {
    dictation = null;
    button.textContent = "Голосом";
  };
  dictation = recognition;
  button.textContent = "Слушаю";
  recognition.start();
};

document.getElementById("speak-conclusion").onclick = () => {
  const synth = window.speechSynthesis;
  if (!synth) return;
  if (synth.speaking) {
    synth.cancel();
    return;
  }
  const protocol = document.getElementById("protocol");
  const text = (protocol.hidden ? document.getElementById("interpretation").innerText : protocol.innerText).trim();
  if (!text) return;
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "ru-RU";
  utterance.rate = 0.95;
  const voice = synth.getVoices().find((item) => item.lang && item.lang.toLowerCase().startsWith("ru"));
  if (voice) utterance.voice = voice;
  synth.speak(utterance);
};
