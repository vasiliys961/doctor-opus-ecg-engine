[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "doctor-opus-ecg-engine"
version = "0.1.0"
description = "Исследовательский ECG engine. Базовый инференс ансамбля 531 признаков."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "torch==2.5.0",
  "fastapi==0.115.6",
  "uvicorn==0.32.1",
  "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["ecg_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
